#
# Create a new GitHub release when a new version-tagged commit is pushed.
#

name: Release

on:
  push:
    tags:
      - "v*" # Triggers on version tags like v1.0.0, v2.1.3, etc.

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to create releases

    steps:
      - name: Checkout version tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # Checks out the specific tag
          fetch-depth: 0 # Full history so tag annotations/messages are available

      - name: Extract release notes from tag message
        id: tag_message
        run: |
          # `%(contents)` includes the PGP signature block for signed tags, so strip
          # everything from the "-----BEGIN PGP SIGNATURE-----" marker onward.
          TAG_MESSAGE=$(git tag -l --format='%(contents)' "${GITHUB_REF#refs/tags/}" | sed '/-----BEGIN PGP SIGNATURE-----/,$d')

          echo "release_notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAG_MESSAGE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes "${{ steps.tag_message.outputs.release_notes }}"
